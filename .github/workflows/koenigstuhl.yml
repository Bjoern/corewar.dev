name: Update Koenigstuhl snapshots
on:
  schedule:
    - cron: '37 4 * * 1'  # Mondays 04:37 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write  # start the Pages deployment
concurrency:
  group: koenigstuhl
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A failed hill keeps its previous snapshot; commit the others, then fail the run below.
      - id: fetch
        continue-on-error: true
        # Weekly runs fetch only new warriors; the first run of each month downloads the full
        # archives, which also picks up edited warriors and drops removed ones.
        run: |
          if [ "$(date -u +%d)" -le 7 ]; then full=--full; fi
          python scripts/fetch_koenigstuhl.py $full
      # Fail before committing if a new snapshot no longer parses.
      - run: python -c "import sys; sys.path.insert(0, 'scripts'); from pathlib import Path; import koenigstuhl; print(len(koenigstuhl.library(Path('.'))), 'hills')"
      # Every run commits at least the new SNAPSHOT dates, so the site shows when the hills were
      # last checked and the weekly commit keeps GitHub from disabling this schedule (60 idle days).
      - name: Commit the snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A koenigstuhl
          if git diff --cached --quiet; then
            echo "Nothing changed (already checked today)."
            exit 0
          fi
          if git diff --cached --name-only | grep -qv '/SNAPSHOT$'; then
            git commit -m "Update Koenigstuhl snapshots"
            # Tag snapshots with new warriors or rankings, so any of them can be checked out or diffed later.
            tag="koenigstuhl-$(date -u +%F)"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              tag="koenigstuhl-$(date -u +%F-%H%M)"  # a second (manual) run on the same day
            fi
            git tag "$tag"
          else
            git commit -m "Check Koenigstuhl snapshots: no changes"
          fi
          git push origin HEAD ${tag:+"refs/tags/$tag"}
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Commits pushed with GITHUB_TOKEN do not trigger the Pages workflow; start it explicitly.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
      - if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Some Koenigstuhl hills failed to download; see the fetch step."
          exit 1
