name: Update Koenigstuhl snapshots
on:
  schedule:
    - cron: '37 4 * * 1'  # Mondays 04:37 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: koenigstuhl
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A failed hill keeps its previous snapshot; commit the others, then fail the run below.
      - id: fetch
        continue-on-error: true
        # Weekly runs fetch only new warriors; the first run of each month downloads the full
        # archives, which also picks up edited warriors and drops removed ones.
        run: |
          if [ "$(date -u +%d)" -le 7 ]; then full=--full; fi
          python scripts/fetch_koenigstuhl.py $full
      # Fail before committing if a new snapshot no longer parses.
      - run: python -c "import sys; sys.path.insert(0, 'scripts'); from pathlib import Path; import koenigstuhl; print(len(koenigstuhl.library(Path('.'))), 'hills')"
      - name: Commit changes or keep the schedule alive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A koenigstuhl
          # SNAPSHOT dates change on every run; only commit when warriors or rankings changed.
          if git diff --cached --name-only | grep -qv '/SNAPSHOT$'; then
            git commit -m "Update Koenigstuhl snapshots"
            # One tag per weekly snapshot, so any week can be checked out or diffed later.
            tag="koenigstuhl-$(date -u +%F)"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              tag="koenigstuhl-$(date -u +%F-%H%M)"  # a second (manual) run on the same day
            fi
            git tag "$tag"
          else
            git reset -q koenigstuhl
            git checkout -- koenigstuhl
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            if [ "$age" -gt $(( 50 * 86400 )) ]; then
              # GitHub disables scheduled workflows after 60 days without repository activity.
              date -u +%F > .github/keepalive
              git add .github/keepalive
              git commit -m "Keep the Koenigstuhl update schedule active"
            else
              echo "No changes."
              exit 0
            fi
          fi
          git push origin HEAD ${tag:+"refs/tags/$tag"}
      - if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Some Koenigstuhl hills failed to download; see the fetch step."
          exit 1
